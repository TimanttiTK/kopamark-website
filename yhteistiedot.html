<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your New Page Title</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1>Kopamark</h1>
        </div>
        <ul class="top-links">
            <li><a href="">Palvelut</a></li>
            <li><a href="yhteistiedot.html">Yhteistiedot</a></li>
            <li><a href="">Referenssit</a></li>
        </ul>
    </div>

    <main>
        <section id="contact">
            <div class="portrait">
                <h2>Ota yhteyttä</h2>
                <img src="./images/tomi.jpg" alt="Tomi Kopaly" class="portrait-image">
                <div class="contact-info">
                    <p>
                        <i class="fas fa-phone"></i>  <!-- Phone icon -->
                        <span>044 231 3252</span>
                    </p>
                    <p>
                        <i class="fas fa-envelope"></i>  <!-- Email icon -->
                        <span>tomikopaly@kopamark.com</span>
                    </p>
                </div>
            </div>
            <form action="#" method="post" class="contact-form">
                <label for="name">Nimi:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Puhelin:</label>
                <input type="phone" id="phone" name="phone" required>

                <label for="email">Sähköposti:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Viesti:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Lähetä</button>
            </form>
        </section>


    </main>

    <footer>
        <p>Copyright &copy; 2024 Kopamark. All rights reserved.</p>
    </footer>
</body>
</html>
